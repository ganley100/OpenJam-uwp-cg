# NBA JAM settings for the Xbox apps. A file of the same name in an app's
# LocalState is read instead of this one, for trying a setting without a
# new build.

# Warnings and errors only: debug logging wrote some 350 lines a second to
# the console's drive. "debug" to bring something new up on the console.
log_level = "warning"

# No cap on the game itself: its pace is tied to its frame rate, so a cap
# below 60 plays it in slow motion.
frame_rate_limit = 0

# How frames reach the TV: no vsync, as before 1.0.46, and no limit. The
# app draws no dialog of its own on the console any more, so the screen is
# repainted only when the game has a new frame; it was the repaints of the
# same frame, at 60 a second, that held a match to 15. present_interval 1
# or more waits for that many display refreshes; present_fps_limit caps the
# frames shown a second (it was 30, and a match then drew a steady 30).
present_interval = 0
present_fps_limit = 0

# Saves: progress does not survive quitting the game on the console. Every
# kernel call the game makes - its profile settings, its save content, the
# storage device it is offered - goes into the log in full until that is
# fixed. The rest of the log stays at warnings.
[log.levels]
krnl = "debug"
