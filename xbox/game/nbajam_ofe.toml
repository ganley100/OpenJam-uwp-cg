# NBA JAM settings for the Xbox apps. A file of the same name in an app's
# LocalState is read instead of this one, for trying a setting without a
# new build.

# Warnings and errors only: debug logging wrote some 350 lines a second to
# the console's drive. "debug" to bring something new up on the console.
log_level = "warning"

# No cap on the game itself: its pace is tied to its frame rate, so a cap
# below 60 plays it in slow motion.
frame_rate_limit = 0

# How frames reach the TV. No vsync, as before 1.0.46 (present_interval 0;
# 1 or more waits for that many display refreshes), and never more than 30
# frames a second (present_fps_limit; 0 for no limit). The game's own pace
# is unaffected.
present_interval = 0
present_fps_limit = 30
