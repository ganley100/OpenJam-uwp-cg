# NBA JAM settings for the Xbox apps. A file of the same name in an app's
# LocalState is read instead of this one, for trying a setting without a
# new build.

# Warnings and errors only: debug logging wrote some 350 lines a second to
# the console's drive. "debug" to bring something new up on the console.
log_level = "warning"

# No cap on the frame rate: the game's pace is tied to its frame rate, so a
# cap below 60 plays it in slow motion.
frame_rate_limit = 0

# Matches drew only 12 to 16 frames a second on the console. Each of these
# makes the CPU wait for the GPU partway through a frame, so both are off
# here; if an effect goes missing in a match, one of them is the cause.
readback_memexport = false
occlusion_query_enable = false

# The video mode the game is told the console is in. Matches drew 12 to 16
# frames a second at 1280x720, with the GPU translation busiest there; a
# widescreen standard-definition mode lets the game draw a smaller frame,
# which the console then scales up to the TV. 1280 and 720 for full HD.
video_mode_width = 854
video_mode_height = 480
