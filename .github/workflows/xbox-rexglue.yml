# Builds ReXGlue v0.10.0 from source with the Xbox patches in
# xbox/rexglue/patches applied, then the game against it. See
# xbox/rexglue/README.md.

name: Xbox ReXGlue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "xbox/rexglue/**"
      - "xbox/game/**"
      - "xbox/smoketest/**"
      - "src/**"
      - "CMakeLists.txt"
      - "*.toml"
      - ".github/workflows/xbox-rexglue.yml"

env:
  REXGLUE_TAG: v0.10.0
  # Outside the checkout, and without "..", which upload-artifact refuses.
  SDK_DIR: D:\rexglue-sdk
  # One configuration, not the SDK preset's three: it is the one the game uses.
  # Release: the SDK only installs its rexglue CLI (codegen) for Release.
  CONFIG: Release

jobs:
  # The SDK as ordinary Windows code with the patches applied, and the game
  # against it: the patches must not change the PC build. Started by hand,
  # since it is a long one and the PC build rarely needs re-proving.
  desktop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: ReXGlue source
        run: |
          git clone --depth 1 --branch $env:REXGLUE_TAG --recurse-submodules --shallow-submodules `
            https://github.com/rexglue/rexglue-sdk $env:SDK_DIR
          if ($LASTEXITCODE -ne 0) { throw "clone failed" }

      - name: Apply Xbox patches
        run: |
          $patches = Get-ChildItem xbox/rexglue/patches -Filter *.patch | Sort-Object Name
          foreach ($p in $patches) {
            Write-Host "applying $($p.Name)"
            git -C $env:SDK_DIR apply --whitespace=nowarn $p.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($p.Name) does not apply" }
          }
          Write-Host "$($patches.Count) patch(es) applied"

      - name: Toolchain
        run: |
          choco install ninja -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: xbox-rexglue-${{ env.REXGLUE_TAG }}

      - name: Configure SDK
        working-directory: ${{ env.SDK_DIR }}
        run: |
          cmake --preset win-amd64 `
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            "-DCMAKE_CONFIGURATION_TYPES=$env:CONFIG" "-DCMAKE_DEFAULT_BUILD_TYPE=$env:CONFIG" `
            "-DCMAKE_CROSS_CONFIGS=$env:CONFIG" "-DCMAKE_DEFAULT_CONFIGS=$env:CONFIG"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build SDK
        working-directory: ${{ env.SDK_DIR }}
        run: |
          cmake --build out/build/win-amd64 --config $env:CONFIG --target install --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          $prefix = (Resolve-Path out/install/win-amd64).Path
          "REXGLUE_PREFIX=$prefix" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # The CLI is not necessarily in bin/; find it.
          $cli = Get-ChildItem out -Recurse -Filter rexglue.exe | Select-Object -First 1
          if (-not $cli) { throw "rexglue.exe was not built" }
          Write-Host "rexglue CLI: $($cli.FullName)"
          $cli.Directory.FullName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      # From here on, the same steps as build.yml, against the SDK just built.
      - name: Game executable
        run: |
          $root = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) "Root"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item game/default.xex "$root/default.xex"

      - name: Generate rexglue.cmake
        run: |
          $tmp = "$env:RUNNER_TEMP\initproj"
          $xex = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) "Root\default.xex"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          rexglue init --project-name nbajam_ofe --xex-path $xex --project-root $tmp
          $found = Get-ChildItem $tmp -Recurse -Filter rexglue.cmake | Select-Object -First 1
          if (-not $found) { throw "rexglue init did not produce generated/rexglue.cmake" }
          New-Item -ItemType Directory -Force generated | Out-Null
          Copy-Item $found.FullName generated/rexglue.cmake

      - name: Configure game
        run: |
          cmake -S . -B out/build/game -G Ninja "-DCMAKE_BUILD_TYPE=$env:CONFIG" `
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            "-DCMAKE_PREFIX_PATH=$env:REXGLUE_PREFIX"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Codegen
        run: |
          cmake --build out/build/game --target nbajam_ofe_codegen
          if ($LASTEXITCODE -ne 0) { throw "codegen failed" }
          cmake -S . -B out/build/game

      - name: Build game
        run: |
          cmake --build out/build/game --parallel
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Collect
        run: |
          $out = "$env:RUNNER_TEMP\nbajam_ofe"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem out/build/game -File | Where-Object { $_.Extension -in '.exe', '.dll' } |
            Copy-Item -Destination $out
          Copy-Item -Recurse metadata "$out/metadata"
          Get-ChildItem $out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: nbajam_ofe-windows-sdk-from-source
          path: ${{ runner.temp }}/nbajam_ofe
          retention-days: 7

  # The SDK built for the Xbox (REXGLUE_UWP=ON). Keeps going past errors so
  # one run reports all of them, then lists which Windows DLLs the runtime
  # imports, to check against what the smoke test found on the console.
  uwp:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: ReXGlue source
        run: |
          git clone --depth 1 --branch $env:REXGLUE_TAG --recurse-submodules --shallow-submodules `
            https://github.com/rexglue/rexglue-sdk $env:SDK_DIR
          if ($LASTEXITCODE -ne 0) { throw "clone failed" }

      - name: Apply Xbox patches
        run: |
          $patches = Get-ChildItem xbox/rexglue/patches -Filter *.patch | Sort-Object Name
          foreach ($p in $patches) {
            Write-Host "applying $($p.Name)"
            git -C $env:SDK_DIR apply --whitespace=nowarn $p.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($p.Name) does not apply" }
          }

      - name: Toolchain
        run: |
          choco install ninja -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # `uwp` puts MSVC's store libraries on LIB: the app C++ runtime
      # (vcruntime140_app, msvcp140_app, from the VCLibs package) rather than
      # the desktop one. Shipped inside the package, the desktop runtime keeps
      # an app from starting on the console at all.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          uwp: true

      # The app runtime needs RoInitialize and friends from WindowsApp.lib, in
      # every binary and in CMake's own compiler checks - which take the
      # linker flags, not the standard libraries.
      - name: App link libraries
        run: |
          "APP_LINK=-lWindowsApp" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # A linker map beside each DLL, so a crash offset names a function.
          "APP_MAP=-Xlinker /MAP" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: xbox-rexglue-uwp-${{ env.REXGLUE_TAG }}

      - name: Configure SDK (UWP)
        working-directory: ${{ env.SDK_DIR }}
        run: |
          cmake --preset win-amd64 -B out/build/uwp `
            -DREXGLUE_UWP=ON `
            "-DCMAKE_EXE_LINKER_FLAGS=$env:APP_LINK" "-DCMAKE_SHARED_LINKER_FLAGS=$env:APP_LINK $env:APP_MAP" `
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            "-DCMAKE_INSTALL_PREFIX=$((Get-Location).Path)/out/install/uwp" `
            "-DCMAKE_CONFIGURATION_TYPES=$env:CONFIG" "-DCMAKE_DEFAULT_BUILD_TYPE=$env:CONFIG" `
            "-DCMAKE_CROSS_CONFIGS=$env:CONFIG" "-DCMAKE_DEFAULT_CONFIGS=$env:CONFIG"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build SDK (UWP)
        working-directory: ${{ env.SDK_DIR }}
        run: |
          cmake --build out/build/uwp --config $env:CONFIG --target install --parallel -- -k 0 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/uwp-build.log"
          $code = $LASTEXITCODE
          Write-Host "===== errors ====="
          Select-String -Path "$env:RUNNER_TEMP/uwp-build.log" -Pattern "error:|error LNK|undefined symbol" |
            ForEach-Object { $_.Line } | Sort-Object -Unique | Select-Object -First 200
          if ($code -ne 0) { throw "build failed" }

      - name: SDK CLI
        run: |
          $prefix = (Resolve-Path "$env:SDK_DIR/out/install/uwp").Path
          "REXGLUE_PREFIX=$prefix" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # The UWP build's own CLI crashes on start (0xC0000409); recorded
          # here, since whatever does it may also matter on the console.
          $uwpcli = "$prefix/bin/rexglue.exe"
          if (Test-Path $uwpcli) {
            Write-Host "UWP-built CLI, --help:"
            & $uwpcli --help 2>&1 | Select-Object -First 15
            Write-Host "exit code $LASTEXITCODE"
            # Where it crashes: the same runtime goes into the game.
            $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
            if (Test-Path $cdb) {
              $syms = "$env:SDK_DIR\out\win-amd64\$env:CONFIG;$prefix\bin"
              & $cdb -y $syms -c "g; .lastevent; kb 40; q" $uwpcli --help 2>&1 |
                Select-String -NotMatch "^(ModLoad|Symbol search|Executable search)" | Select-Object -Last 70
            } else {
              Write-Host "no cdb on this runner"
            }
          }
          # Codegen runs on this machine, so it uses the released desktop CLI.
          $zip = "$env:RUNNER_TEMP\rexglue-desktop.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            "https://github.com/rexglue/rexglue-sdk/releases/download/$env:REXGLUE_TAG/rexglue-sdk-$($env:REXGLUE_TAG.TrimStart('v'))-win-amd64.zip"
          Expand-Archive $zip "$env:RUNNER_TEMP\rexglue-desktop"
          $cli = Get-ChildItem "$env:RUNNER_TEMP\rexglue-desktop" -Recurse -Filter rexglue.exe | Select-Object -First 1
          if (-not $cli) { throw "rexglue.exe not in the desktop SDK" }
          "REXGLUE_CLI=$($cli.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $global:LASTEXITCODE = 0

      # The game, as the Xbox app (NBAJAM_UWP), against that SDK.
      - name: Game executable
        run: |
          $root = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) "Root"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item game/default.xex "$root/default.xex"

      - name: Generate rexglue.cmake
        run: |
          $tmp = "$env:RUNNER_TEMP\initproj"
          $xex = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) "Root\default.xex"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          & $env:REXGLUE_CLI init --project-name nbajam_ofe --xex-path $xex --project-root $tmp
          if ($LASTEXITCODE -ne 0) { throw "rexglue init failed ($LASTEXITCODE)" }
          $found = Get-ChildItem $tmp -Recurse -Filter rexglue.cmake | Select-Object -First 1
          if (-not $found) { throw "rexglue init did not produce generated/rexglue.cmake" }
          New-Item -ItemType Directory -Force generated | Out-Null
          Copy-Item $found.FullName generated/rexglue.cmake

      - name: Configure game (UWP)
        run: |
          cmake -S . -B out/build/game-uwp -G Ninja "-DCMAKE_BUILD_TYPE=$env:CONFIG" `
            -DNBAJAM_UWP=ON "-DNBAJAM_CODEGEN_CLI=$env:REXGLUE_CLI" `
            "-DCMAKE_EXE_LINKER_FLAGS=$env:APP_LINK" "-DCMAKE_SHARED_LINKER_FLAGS=$env:APP_LINK" `
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            "-DCMAKE_PREFIX_PATH=$env:REXGLUE_PREFIX"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Codegen
        run: |
          cmake --build out/build/game-uwp --target nbajam_ofe_codegen
          if ($LASTEXITCODE -ne 0) { throw "codegen failed" }
          cmake -S . -B out/build/game-uwp

      - name: Build game (UWP)
        run: |
          cmake --build out/build/game-uwp --parallel -- -k 0 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/game-build.log" | Select-Object -Last 40
          $code = $LASTEXITCODE
          Write-Host "===== errors ====="
          Select-String -Path "$env:RUNNER_TEMP/game-build.log" -Pattern "error:|error LNK|undefined symbol" |
            ForEach-Object { $_.Line } | Sort-Object -Unique | Select-Object -First 200
          if ($code -ne 0) { throw "build failed" }

      # What the app needs from the console, to check against the smoke test.
      - name: What the app imports
        if: always()
        run: |
          Get-ChildItem out/build/game-uwp -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in ".exe", ".dll" } | ForEach-Object {
              Write-Host "== $($_.Name)"
              dumpbin /dependents $_.FullName | Select-String -Pattern "\.dll" | ForEach-Object { "   " + $_.Line.Trim() }
            }

      # The smoke test, for the package's diagnostics tile. Built as the
      # standalone one is, which is known to run on the console.
      - name: Diagnostics
        run: |
          cmake -S xbox/smoketest -B out/build/diagnostics -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=clang-cl
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build out/build/diagnostics
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Package
        run: ./xbox/game/package.ps1 -BuildDir out/build/game-uwp -Out out/appx -Version "1.0.${{ github.run_number }}.0" -Diagnostics out/build/diagnostics/smoketest.exe

      - name: Linker maps
        if: always()
        run: |
          New-Item -ItemType Directory -Force out/maps | Out-Null
          Get-ChildItem "$env:SDK_DIR/out" -Recurse -Filter *.map -ErrorAction SilentlyContinue |
            Copy-Item -Destination out/maps
          Get-ChildItem out/maps
          # Each DLL's DllMain must be its own or the CRT's. xinputuap.lib
          # exports one, and a DLL that took it called XINPUTUAP's DllMain as
          # its own on every load - the app closing on the console.
          $bad = Select-String -Path out/maps/*.map -Pattern "^\s*\S+\s+DllMain\s+\S+\s+xinputuap"
          if ($bad) { $bad | ForEach-Object { $_.Line }; throw "a DLL's DllMain comes from xinputuap.lib" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linker-maps
          path: out/maps
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: nbajam-xbox-appx
          path: out/appx
          retention-days: 30
